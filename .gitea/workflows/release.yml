name: Release

on:
  push:
    tags:
      - '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/${{ gitea.repository }}:${{ gitea.ref_name }}
            ${{ secrets.REGISTRY_HOST }}/${{ gitea.repository }}:latest

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      releases: write
    steps:
      - name: Create Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ gitea.server_url }}
          REPOSITORY: ${{ gitea.repository }}
          TAG_NAME: ${{ gitea.ref_name }}
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
        run: |
          set -eu
          release_body="Docker 镜像已发布：${REGISTRY_HOST}/${REPOSITORY}:${TAG_NAME}"
          payload="$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg body "$release_body" \
            '{tag_name: $tag, target_commitish: $tag, name: $tag, body: $body, draft: false, prerelease: false}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${SERVER_URL}/api/v1/repos/${REPOSITORY}/releases"
